name: Release

# Pushing a tag such as v0.7.0 tests that commit, publishes it to GitHub Packages and creates the
# GitHub release. The tag has to match the version in build.sbt, or the job stops before publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check the tag against the build's version
        run: |
          version=$(sbt -batch -no-colors 'print version' | tail -1 | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match build version $version" >&2
            exit 1
          fi
      - name: Test
        run: sbt -batch test
      # Both steps are safe to re-run. GitHub Packages refuses a release version it already has with
      # HTTP 409, which after a failure further down means the publish already happened, so a 409 is
      # taken as done; the jars are built either way. The release step uploads to an existing
      # release instead of failing on it.
      - name: Publish to GitHub Packages
        run: |
          if ! sbt -batch publish 2>&1 | tee publish.log; then
            if grep -q '409' publish.log; then
              echo "$GITHUB_REF_NAME is already on GitHub Packages; continuing to the release"
            else
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber target/scala-*/scotty_3-*.jar
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes target/scala-*/scotty_3-*.jar
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
