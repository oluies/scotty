name: Release

# Pushing a tag such as v0.7.0 tests that commit, publishes it to GitHub Packages and creates the
# GitHub release. The tag has to match the version in build.sbt, or the job stops before publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check the tag against the build's version
        run: |
          version=$(sbt -batch -no-colors 'print version' | tail -1 | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match build version $version" >&2
            exit 1
          fi
      - name: Test
        run: sbt -batch test
      - name: Publish to GitHub Packages
        run: sbt -batch publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes target/scala-*/scotty_3-*.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
