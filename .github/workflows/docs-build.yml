name: Docs site build

# Builds the documentation site on pull requests, and nothing else.
#
# pages.yml, which deploys, runs only on pctc, on releases and by hand; it holds the `pages`
# concurrency group and the github-pages environment, so a pull request run there would cancel an
# in-flight deploy. This builds the same site without either, so a README edit that breaks a
# generated link, or a dependency bump in website/, fails here and not first on pctc. Docusaurus
# throws on broken links and anchors (onBrokenLinks, onBrokenAnchors), so a passing build is a check.

on:
  pull_request:
    paths:
      - "README.md"
      - "src/main/**"
      - "build.sbt"
      - "website/**"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: Scaladoc
        run: |
          sbt -batch doc
          rm -rf website/static/api
          cp -R target/scala-*/api website/static/api

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Generate the pages from README.md and build the site
        working-directory: website
        run: |
          npm ci
          npm run build
